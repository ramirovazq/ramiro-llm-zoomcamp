id: nyc_taxi_to_bigquery
namespace: company.team

description: Load NYC Taxi CSV data into Google BigQuery

inputs:
  - id: gcpProjectId
    type: STRING
    defaults: "your-gcp-project-id"
    description: "The GCP Project ID where the BigQuery table resides"

  - id: datasetId
    type: STRING
    defaults: "nyc_taxi"
    description: "The BigQuery Dataset ID"

  - id: tableId
    type: STRING
    defaults: "yellow_trips"
    description: "The BigQuery Table ID to load data into"

tasks:
  - id: download_csv
    type: io.kestra.plugin.core.http.Download
    uri: https://github.com/DataTalksClub/nyc-tlc-data/releases/download/yellow/yellow_tripdata_2021-01.csv

  - id: load_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.Load
    from: "{{ outputs.download_csv.uri }}"
    destinationTable: "{{ inputs.gcpProjectId }}.{{ inputs.datasetId }}.{{ inputs.tableId }}"
    format: CSV
    autodetect: true
    createDisposition: CREATE_IF_NEEDED
    writeDisposition: WRITE_TRUNCATE
    csvOptions:
      skipLeadingRows: 1
      allowJaggedRows: true